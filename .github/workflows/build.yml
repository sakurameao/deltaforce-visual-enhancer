name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-dylib:
    name: Build iOS arm64 dylib
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh build/DFXEnhance.dylib

      - name: Verify binary
        run: |
          file build/DFXEnhance.dylib
          otool -hv build/DFXEnhance.dylib
          otool -L build/DFXEnhance.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFXEnhance-dylib
          path: build/DFXEnhance.dylib
          if-no-files-found: error
